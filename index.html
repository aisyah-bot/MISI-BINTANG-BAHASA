
<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misi Bintang Bacaan — Pengembaraan Peribahasa</title>
<style>
:root{
  --ungu:#5136a6;
  --emas:#ffc944;
  --biru:#093c72;
  --putih:#fffaf0;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  color:#fff;
  background:#061a39;
}
button,input{font:inherit}
button{
  cursor:pointer;
  border:0;
  font-weight:bold;
}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible{
  outline:4px solid #ffe36e;
  outline-offset:3px;
}
[hidden]{display:none!important}
#app{min-height:100vh}
.scene{
  min-height:100vh;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  position:relative;
  overflow:hidden;
}
.scene:before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    90deg,
    rgba(3,18,51,.78),
    rgba(3,18,51,.28),
    rgba(3,18,51,.42)
  );
  pointer-events:none;
}
.content{
  position:relative;
  z-index:1;
  width:min(1200px,96%);
  margin:auto;
  padding:24px 12px 60px;
}
nav{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:30px;
}
.logo{
  font-size:clamp(18px,3vw,26px);
  font-weight:900;
  text-shadow:0 3px 5px #03142f;
}
.btn{
  padding:14px 23px;
  border-radius:18px;
  background:linear-gradient(#ffec81,#ffb923);
  color:#583600;
  box-shadow:0 6px 0 #ad6e08;
  margin:5px;
  transition:.15s;
}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:active:not(:disabled){transform:translateY(3px)}
.btn.blue{
  background:linear-gradient(#38bcf8,#0879ce);
  color:white;
  box-shadow:0 6px 0 #07508e;
}
.btn.green{
  background:linear-gradient(#5fe99c,#08a761);
  color:white;
  box-shadow:0 6px 0 #086e44;
}
.btn.red{
  background:linear-gradient(#fc7594,#c62e62);
  color:white;
  box-shadow:0 6px 0 #881a40;
}
.btn.dark{
  background:#123d67;
  color:#fff;
  box-shadow:0 5px 0 #072545;
}
.btn.small{
  padding:9px 13px;
  font-size:13px;
}
.panel{
  background:rgba(6,26,66,.88);
  backdrop-filter:blur(8px);
  padding:25px;
  border:3px solid #ffe39c;
  border-radius:28px;
  box-shadow:0 18px 40px #0008;
  margin:18px 0;
}
.panel.light{
  background:rgba(255,250,236,.97);
  color:#282456;
}
h1{
  font-size:clamp(36px,6vw,72px);
  color:#ffde62;
  text-shadow:0 5px #713900,0 8px 15px #000;
  margin:10px 0;
}
h2{font-size:clamp(24px,4vw,38px);margin:10px 0}
h3{font-size:23px}
p{line-height:1.65}
.center{text-align:center}
.hero{
  max-width:760px;
  margin:8vh auto 0;
  text-align:center;
}
input{
  padding:15px;
  border-radius:15px;
  border:3px solid #ffcb47;
  width:min(100%,400px);
  background:white;
  color:#242044;
  font-size:19px;
}
.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}
.card{
  background:rgba(255,250,235,.97);
  border:3px solid #ffe39c;
  border-radius:22px;
  overflow:hidden;
  color:#292348;
  box-shadow:0 14px 25px #001a;
}
.card img{
  width:100%;
  height:210px;
  object-fit:cover;
}
.card-body{padding:17px}
.card h3{color:#4b309f;margin:8px 0}
.readtext{
  background:linear-gradient(135deg,#fff8df,#ffffff);
  color:#302451;
  border:4px solid #ffd466;
  border-radius:24px;
  padding:26px;
  font-size:clamp(24px,3.6vw,35px);
  font-weight:800;
  line-height:1.55;
  margin:18px 0;
}
.options{
  display:grid;
  gap:10px;
}
.option,.tile{
  padding:15px;
  border-radius:15px;
  background:#fff4d8;
  border:3px solid #ffcf66;
  color:#372960;
  font-size:18px;
  text-align:left;
}
.option.selected{background:#b8f1d3;border-color:#27ba7b}
.tiles{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  padding:15px;
  border:2px dashed #f3cf72;
  min-height:70px;
  border-radius:15px;
  margin:12px 0;
}
.tile{font-weight:bold}
.message{
  background:#e3f4ff;
  color:#193b6a;
  padding:14px;
  border-radius:14px;
  margin:12px 0;
  line-height:1.55;
}
.message.good{background:#d5f8df;color:#155a38}
.message.bad{background:#ffe1e3;color:#79253c}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stat{
  background:#fff5d2;
  color:#523900;
  padding:10px 15px;
  border-radius:13px;
  display:inline-block;
  margin:5px;
  font-weight:bold;
}
.progress{
  height:14px;
  background:#ffffff55;
  border-radius:20px;
  overflow:hidden;
  margin:15px 0;
}
.progress>div{
  height:100%;
  background:linear-gradient(90deg,#ffb91c,#fff391);
}
#teacherPage{
  background:#eef3ff;
  color:#222344;
  min-height:100vh;
  padding:20px;
}
.teacherPanel{
  max-width:1150px;
  margin:0 auto 20px;
  background:white;
  padding:22px;
  border-radius:20px;
  box-shadow:0 10px 25px #22335518;
}
table{
  border-collapse:collapse;
  width:100%;
  min-width:780px;
}
th,td{
  padding:11px;
  border-bottom:1px solid #ddd;
  text-align:left;
}
th{background:#ded9fa}
.tablewrap{overflow:auto}
.rubric{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.rubric input{width:100%}
.teacherPanel label{display:block;margin:10px 0}
.recording{
  animation:pulse 1s infinite;
}
@keyframes pulse{
  50%{box-shadow:0 0 0 14px #ff547744}
}
@media(max-width:760px){
  .cards,.rubric{grid-template-columns:1fr}
  .content{padding:12px 8px 40px}
  .panel{padding:16px}
  .card img{height:185px}
  .scene{background-position:center}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
@media print{
  nav,.btn,.no-print{display:none!important}
  .scene{background:white!important;color:black}
  .panel{box-shadow:none;background:white;color:black}
}
</style>
</head>

<body>
<div id="app"></div>

<script>
"use strict";

/* NAMA FAIL SEBENAR DALAM REPOSITORI */
const IMAGES={
  home:"latar-pengembaraan.png.png",
  levels:[
    "assets-tahap1-masa-itu-emas.png",
    "assets-tahap2-berganding-bahu.png",
    "assets-tahap3-warisan.png.png"
  ]
};

const AUDIO=[
  ["t1-ayat1.mp3.mp3","t1-ayat2.mp3.mp3"],
  ["t2-ayat1.mp3.mp3","t2-ayat2.mp3.mp3"],
  ["t3-ayat1.mp3.mp3","t3-ayat2.mp3.mp3"]
];

const LEVELS=[
{
 title:"Masa itu emas",
 world:"Istana Masa Emas",
 meaning:"Masa sangat berharga dan perlu digunakan dengan sebaik-baiknya.",
 texts:[
  "Masa itu emas",
  "Aiman menyiapkan kerja sekolahnya dengan segera kerana dia tahu bahawa masa itu emas.",
  "Siti menggunakan masa lapangnya untuk membaca buku kerana dia percaya bahawa masa itu emas."
 ],
 quiz:[
  {
   type:"choice",
   question:'Apakah maksud peribahasa "masa itu emas"?',
   options:[
    "Masa sangat berharga dan perlu digunakan dengan baik.",
    "Masa boleh dibeli menggunakan emas.",
    "Masa hanya penting semasa di sekolah."
   ],
   correct:0,
   reason:"Masa perlu dihargai dan digunakan dengan sebaik-baiknya."
  },
  {
   type:"order",
   question:"Susun perkataan menjadi ayat yang betul.",
   tokens:["Siti","menggunakan","masa","lapangnya","untuk","membaca","buku."],
   reason:"Siti menggunakan masa lapangnya untuk membaca buku."
  }
 ]
},
{
 title:"Berganding bahu",
 world:"Kampung Kerjasama",
 meaning:"Bekerjasama untuk melakukan sesuatu pekerjaan atau mencapai sesuatu tujuan.",
 texts:[
  "Berganding bahu",
  "Murid-murid Tahun 4 berganding bahu membersihkan kelas supaya persekitaran sekolah sentiasa bersih.",
  "Penduduk kampung berganding bahu membantu mangsa banjir dengan mengumpulkan makanan dan pakaian."
 ],
 quiz:[
  {
   type:"choice",
   question:"Situasi manakah menunjukkan amalan berganding bahu?",
   options:[
    "Murid-murid membersihkan kelas bersama-sama.",
    "Seorang murid melakukan semua kerja seorang diri.",
    "Murid-murid enggan membantu rakan."
   ],
   correct:0,
   reason:"Berganding bahu bermaksud melakukan sesuatu secara bekerjasama."
  },
  {
   type:"choice",
   question:"Bagaimanakah penduduk kampung membantu mangsa banjir?",
   options:[
    "Mengumpulkan makanan dan pakaian.",
    "Membiarkan mangsa banjir tanpa bantuan.",
    "Menyembunyikan makanan daripada mangsa."
   ],
   correct:0,
   reason:"Penduduk kampung mengumpulkan makanan dan pakaian untuk membantu mangsa banjir."
  }
 ]
},
{
 title:"Tak lapuk dek hujan, tak lekang dek panas",
 world:"Khazanah Warisan",
 meaning:"Sesuatu yang kekal sepanjang zaman dan tidak dilupakan walaupun zaman berubah.",
 texts:[
  "Tak lapuk dek hujan, tak lekang dek panas",
  "Permainan congkak masih popular hingga kini kerana warisan ini tak lapuk dek hujan, tak lekang dek panas.",
  "Siti mempelajari tarian zapin daripada neneknya supaya seni tradisional itu tak lapuk dek hujan, tak lekang dek panas."
 ],
 quiz:[
  {
   type:"choice",
   question:'Apakah maksud "tak lapuk dek hujan, tak lekang dek panas"?',
   options:[
    "Sesuatu yang kekal sepanjang zaman walaupun zaman berubah.",
    "Sesuatu yang hanya wujud semasa hujan.",
    "Sesuatu yang cepat dilupakan."
   ],
   correct:0,
   reason:"Warisan yang bernilai tetap dihargai walaupun zaman berubah."
  },
  {
   type:"choice",
   question:"Mengapakah Siti mempelajari tarian zapin daripada neneknya?",
   options:[
    "Supaya seni tradisional terus diwarisi.",
    "Supaya seni tradisional dilupakan.",
    "Supaya semua permainan moden dihentikan."
   ],
   correct:0,
   reason:"Siti mahu membantu mengekalkan warisan seni tradisional."
  }
 ]
}
];

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
}[c]));

const KEY="misi-bintang-bacaan-v4";
let player=null;
let level=0;
let item=0;
let chosen=null;
let order=[];
let mediaRecorder=null;
let mediaStream=null;
let pieces=[];
let recognition=null;
let audio=null;
let db=null;
let recordingTimer=null;
let recordingStarted=0;

function blankProgress(){
 return LEVELS.map(()=>({
  readings:[false,false,false],
  transcript:["","",""],
  match:[null,null,null],
  comprehension:[null,null],
  attempts:[0,0],
  grades:[
   {s:null,f:null,i:null},
   {s:null,f:null,i:null},
   {s:null,f:null,i:null}
  ],
  finished:false
 }));
}

function save(){
 if(!player)return;
 try{localStorage.setItem(KEY,JSON.stringify(player))}
 catch(e){console.warn("Storan setempat gagal",e)}
 saveDB("sessions",player);
}

function load(){
 try{
  const x=JSON.parse(localStorage.getItem(KEY));
  if(x && Array.isArray(x.progress))player=x;
 }catch(e){}
}

function newPlayer(name){
 player={
  id:"murid-"+Date.now()+"-"+Math.random().toString(36).slice(2,8),
  name,
  date:new Date().toISOString(),
  progress:blankProgress()
 };
 save();
}

function initDB(){
 return new Promise(resolve=>{
  if(!window.indexedDB){resolve(null);return}
  const r=indexedDB.open("MisiBintangRekod",1);
  r.onupgradeneeded=()=>{
   const d=r.result;
   if(!d.objectStoreNames.contains("sessions"))
    d.createObjectStore("sessions",{keyPath:"id"});
   if(!d.objectStoreNames.contains("clips"))
    d.createObjectStore("clips",{keyPath:"key"});
  };
  r.onsuccess=()=>resolve(r.result);
  r.onerror=()=>resolve(null);
 });
}

function saveDB(store,value){
 return new Promise(resolve=>{
  if(!db){resolve(false);return}
  try{
   const t=db.transaction(store,"readwrite");
   t.objectStore(store).put(value);
   t.oncomplete=()=>resolve(true);
   t.onerror=()=>resolve(false);
  }catch(e){resolve(false)}
 });
}

function getDB(store,key){
 return new Promise(resolve=>{
  if(!db){resolve(null);return}
  try{
   const t=db.transaction(store,"readonly");
   const r=t.objectStore(store).get(key);
   r.onsuccess=()=>resolve(r.result||null);
   r.onerror=()=>resolve(null);
  }catch(e){resolve(null)}
 });
}

function allDB(store){
 return new Promise(resolve=>{
  if(!db){resolve([]);return}
  try{
   const r=db.transaction(store,"readonly")
     .objectStore(store).getAll();
   r.onsuccess=()=>resolve(r.result||[]);
   r.onerror=()=>resolve([]);
  }catch(e){resolve([])}
 });
}

function deleteDB(store,key){
 return new Promise(resolve=>{
  if(!db){resolve(false);return}
  try{
   const t=db.transaction(store,"readwrite");
   t.objectStore(store).delete(key);
   t.oncomplete=()=>resolve(true);
   t.onerror=()=>resolve(false);
  }catch(e){resolve(false)}
 });
}

function cleanup(){
 if(audio){audio.pause();audio=null}
 if("speechSynthesis" in window)speechSynthesis.cancel();
 if(recordingTimer){clearInterval(recordingTimer);recordingTimer=null}
 if(mediaRecorder && mediaRecorder.state==="recording"){
  try{mediaRecorder.stop()}catch(e){}
 }
 if(mediaStream){
  mediaStream.getTracks().forEach(x=>x.stop());
  mediaStream=null;
 }
 if(recognition){
  try{recognition.abort()}catch(e){}
  recognition=null;
 }
}

function scene(image,body,teacher=false){
 cleanup();
 $("app").innerHTML=`
 <div class="scene" style="background-image:url('${image}')">
 <div class="content">
 <nav>
 <div class="logo">⭐ MISI BINTANG BACAAN</div>
 <div class="row">
 <button class="btn dark small" id="homeNav">🏠 Utama</button>
 ${teacher?'':`<button class="btn dark small" id="mapNav">🗺️ Peta</button>`}
 </div>
 </nav>
 ${body}
 </div></div>`;
 $("homeNav").onclick=home;
 if($("mapNav"))$("mapNav").onclick=map;
}

function home(){
 scene(IMAGES.home,`
 <div class="panel hero">
 <h1>MISI BINTANG BACAAN</h1>
 <h2>PENGEMBARAAN PERIBAHASA</h2>
 <p>Dengar, Baca, Fahami dan Raih Bintang!</p>
 <p>Bahasa Melayu Tahun 4 · SK 2.1 · SP 2.1.1</p>
 <label for="student"><strong>Masukkan nama kamu</strong></label>
 <br><br>
 <input id="student" maxlength="50"
 placeholder="Nama murid..."
 value="${esc(player?.name||"")}">
 <br><br>
 <button class="btn green" id="start">▶ MULA PENGEMBARAAN</button>
 <button class="btn blue" id="how">CARA BERMAIN</button>
 <p id="notice"></p>
 </div>
 <div class="center">
 <button class="btn dark small" id="teacherAccess">
 ⚙ Ruang Guru
 </button>
 </div>
 `);
 $("start").onclick=()=>{
  const name=$("student").value.trim();
  if(!name){
   $("notice").textContent="Sila masukkan nama kamu dahulu.";
   return;
  }
  if(!player||player.name!==name)newPlayer(name);
  map();
 };
 $("how").onclick=()=>{
  $("notice").innerHTML=`
  <span class="message">
  1. Pilih tahap.<br>
  2. Dengar contoh bacaan.<br>
  3. Rakam peribahasa dan dua ayat.<br>
  4. Jawab cabaran kefahaman.<br>
  5. Kumpulkan bintang dan teruskan pengembaraan.
  </span>`;
 };
 $("teacherAccess").onclick=teacherPage;
}

function completed(p){
 return p.readings.every(Boolean) &&
 p.comprehension.every(x=>x!==null);
}

function readingMark(p){
 if(p.grades.some(g=>
  g.s===null||g.f===null||g.i===null))return null;
 return p.grades.reduce((v,g)=>v+g.s+g.f+g.i,0);
}

function totalMark(p){
 const r=readingMark(p);
 if(r===null)return null;
 return r+p.comprehension.reduce((a,b)=>a+(b||0),0);
}

function stars(n){
 return n>=80?3:n>=50?2:1;
}

function unlocked(i){
 return i===0 || player.progress[i-1].finished;
}

function map(){
 if(!player){home();return}
 scene(IMAGES.home,`
 <section class="panel center">
 <h2>🗺️ PETA PENGEMBARAAN</h2>
 <p>Selamat datang, <strong>${esc(player.name)}</strong>!</p>
 <p>Terokai tiga dunia peribahasa daripada mudah kepada sukar.</p>
 </section>
 <section class="cards">
 ${LEVELS.map((l,i)=>`
 <div class="card">
 <img src="${IMAGES.levels[i]}"
 alt="Ilustrasi ${esc(l.world)}">
 <div class="card-body center">
 <h3>TAHAP ${i+1}</h3>
 <h3>${esc(l.title)}</h3>
 <p>${esc(l.world)}</p>
 <p>
 ${player.progress[i].finished?"🌟 Tahap selesai":
 unlocked(i)?"⭐ Sedia dimainkan":"🔒 Terkunci"}
 </p>
 <button class="btn ${unlocked(i)?"green":"dark"}"
 data-level="${i}" ${unlocked(i)?"":"disabled"}>
 ${unlocked(i)?"MULA MISI":"TERKUNCI"}
 </button>
 </div></div>`).join("")}
 </section>
 <div class="panel center">
 <p>Bintang rasmi: ${
 player.progress.reduce((n,p)=>{
 const m=totalMark(p);
 return n+(m===null?0:stars(m));
 },0)}</p>
 <button class="btn" id="certificate" ${
 player.progress.every(x=>x.finished)?"":"disabled"}>
 🏆 SIJIL PENCAPAIAN
 </button>
 </div>
 `);
 document.querySelectorAll("[data-level]").forEach(b=>{
  b.onclick=()=>intro(+b.dataset.level);
 });
 $("certificate").onclick=certificate;
}

function intro(i){
 level=i;
 const l=LEVELS[i];
 scene(IMAGES.levels[i],`
 <section class="panel">
 <h2>TAHAP ${i+1}</h2>
 <h1>${esc(l.title)}</h1>
 <p><strong>Maksud:</strong> ${esc(l.meaning)}</p>
 <div class="progress"><div style="width:10%"></div></div>
 <div class="panel light">
 <h3>Misi Bacaan</h3>
 <p>1. Dengar dan baca peribahasa.</p>
 <p>2. Dengar dan baca ayat pertama.</p>
 <p>3. Dengar dan baca ayat kedua.</p>
 <p>4. Jawab dua aktiviti kefahaman.</p>
 </div>
 <button class="btn green" id="beginReading">
 ▶ MULA AKTIVITI BACAAN
 </button>
 </section>
 `);
 $("beginReading").onclick=()=>reading(0);
}

function reading(i){
 item=i;
 const l=LEVELS[level];
 const p=player.progress[level];
 const labels=["PERIBAHASA","AYAT PERTAMA","AYAT KEDUA"];
 scene(IMAGES.levels[level],`
 <section class="panel">
 <h2>TAHAP ${level+1} — MISI BACAAN</h2>
 <p>${labels[i]} · ${i+1}/3</p>
 <div class="progress">
 <div style="width:${((i+1)/3)*75}%"></div>
 </div>
 <div class="readtext">${esc(l.texts[i])}</div>
 <div class="row">
 <button class="btn" id="hear">🔊 DENGAR CONTOH</button>
 <button class="btn blue" id="repeat">🔁 ULANG AUDIO</button>
 </div>
 <div class="panel">
 <h3>🎙 Rakaman Bacaan Kamu</h3>
 <p>Baca teks di atas menggunakan sebutan yang jelas
 dan intonasi yang sesuai.</p>
 <div class="row">
 <button class="btn green" id="record">⏺ MULA RAKAMAN</button>
 <button class="btn red" id="stop" disabled>⏹ HENTIKAN</button>
 <button class="btn blue" id="playMine">▶ DENGAR RAKAMAN</button>
 <button class="btn" id="checkRead">✅ SEMAK BACAAN</button>
 </div>
 <p id="timer"></p>
 <div id="readStatus"></div>
 </div>
 <button class="btn green" id="nextRead">
 ${i===2?"TERUSKAN KE KEFAHAMAN":"BACAAN SETERUSNYA"} →
 </button>
 </section>
 `);
 $("hear").onclick=()=>hear();
 $("repeat").onclick=()=>hear();
 $("record").onclick=startRecording;
 $("stop").onclick=stopRecording;
 $("playMine").onclick=playMine;
 $("checkRead").onclick=checkReading;
 $("nextRead").onclick=()=>{
  if(!p.readings[item]){
   $("readStatus").innerHTML=
    '<div class="message bad">Sila lengkapkan rakaman terlebih dahulu.</div>';
   return;
  }
  if(item<2)reading(item+1);
  else quiz(0);
 };
}

function hear(){
 const file=item>0?AUDIO[level][item-1]:null;
 if(audio){audio.pause();audio=null}
 if("speechSynthesis" in window)speechSynthesis.cancel();

  audio.play().catch(()=>{
   box.innerHTML='<div class="message bad">Audio tidak ditemui. Semak nama fail MP3 dalam GitHub.</div>';
  });
  return;
 }
 if("speechSynthesis" in window){
  const voices=speechSynthesis.getVoices();
  const voice=voices.find(v=>
   v.lang.toLowerCase()==="ms-my");
  if(voice){
   const u=new SpeechSynthesisUtterance(
    LEVELS[level].texts[item]);
   u.voice=voice;
   u.lang="ms-MY";
   u.rate=.88;
   speechSynthesis.speak(u);
   return;
  }
 }
 box.innerHTML=
 '<div class="message">Audio peribahasa belum tersedia. Guru boleh menunjukkan contoh bacaan.</div>';
}

function clipKey(){
 return player.id+"-"+level+"-"+item;
}

async function startRecording(){
 if(!navigator.mediaDevices?.getUserMedia ||
 typeof MediaRecorder==="undefined"){
  $("readStatus").innerHTML=
  '<div class="message bad">Mikrofon tidak disokong oleh pelayar ini.</div>';
  return;
 }
 try{
  if(audio)audio.pause();
  if("speechSynthesis" in window)speechSynthesis.cancel();
  mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});
  const types=[
   "audio/webm;codecs=opus",
   "audio/webm",
   "audio/mp4"
  ];
  const type=types.find(x=>MediaRecorder.isTypeSupported(x));
  mediaRecorder=new MediaRecorder(
   mediaStream,type?{mimeType:type}:undefined);
  pieces=[];
  const targetLevel=level,targetItem=item,targetPlayer=player;
  let transcript="";
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){
   try{
    recognition=new SR();
    recognition.lang="ms-MY";
    recognition.interimResults=false;
    recognition.onresult=e=>{
     transcript=Array.from(e.results)
      .map(r=>r[0].transcript).join(" ");
    };
    recognition.start();
   }catch(e){recognition=null}
  }
  mediaRecorder.ondataavailable=e=>{
   if(e.data.size)pieces.push(e.data);
  };
  mediaRecorder.onstop=async()=>{
   const blob=new Blob(pieces,{
    type:mediaRecorder.mimeType||"audio/webm"
   });
   await saveDB("clips",{
    key:targetPlayer.id+"-"+targetLevel+"-"+targetItem,
    blob
   });
   const entry=targetPlayer.progress[targetLevel];
   entry.readings[targetItem]=true;
   if(transcript)entry.transcript[targetItem]=transcript;
   save();
   if($("readStatus"))$("readStatus").innerHTML=
    '<div class="message good">Rakaman selesai! Kamu boleh mendengar semula bacaan.</div>';
   if($("record"))$("record").disabled=false;
   if($("stop"))$("stop").disabled=true;
  };
  mediaRecorder.start();
  recordingStarted=Date.now();
  $("record").disabled=true;
  $("record").classList.add("recording");
  $("stop").disabled=false;
  $("readStatus").textContent="Rakaman sedang berlangsung...";
  recordingTimer=setInterval(()=>{
   if($("timer"))$("timer").textContent=
    Math.floor((Date.now()-recordingStarted)/1000)+" saat";
  },1000);
 }catch(e){
  $("readStatus").innerHTML=
   '<div class="message bad">Akses mikrofon gagal. Sila benarkan mikrofon dalam tetapan pelayar.</div>';
 }
}

function stopRecording(){
 if(recordingTimer)clearInterval(recordingTimer);
 recordingTimer=null;
 if(recognition){
  try{recognition.stop()}catch(e){}
 }
 if(mediaRecorder&&mediaRecorder.state!=="inactive"){
  mediaRecorder.stop();
 }
 if(mediaStream){
  mediaStream.getTracks().forEach(t=>t.stop());
  mediaStream=null;
 }
 if($("record"))$("record").classList.remove("recording");
}

async function playMine(){

 const url=URL.createObjectURL(data.blob);

 a.onended=()=>URL.revokeObjectURL(url);
 a.play().catch(()=>{
  URL.revokeObjectURL(url);
  $("readStatus").textContent="Rakaman gagal dimainkan.";
 });
}

function wordScore(original,heard){
 const tokenize=s=>s.toLowerCase()
  .replace(/[.,!?;:]/g,"").split(/\s+/).filter(Boolean);
 const a=tokenize(original),b=tokenize(heard);
 const dp=Array.from({length:a.length+1},
  ()=>Array(b.length+1).fill(0));
 for(let i=0;i<=a.length;i++)dp[i][0]=i;
 for(let j=0;j<=b.length;j++)dp[0][j]=j;
 for(let i=1;i<=a.length;i++)
 for(let j=1;j<=b.length;j++)
 dp[i][j]=Math.min(
  dp[i-1][j]+1,
  dp[i][j-1]+1,
  dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1)
 );
 return Math.max(0,Math.round(
  100*(1-dp[a.length][b.length]/Math.max(1,a.length,b.length))
 ));
}

function checkReading(){
 const p=player.progress[level];
 if(!p.readings[item]){
  $("readStatus").textContent="Rakam bacaan dahulu.";
  return;
 }
 const text=p.transcript[item];
 if(!text){
  $("readStatus").innerHTML=
   '<div class="message">Rakaman tersedia. Pengecaman suara tidak tersedia atau tidak berjaya. Semakan guru diperlukan.</div>';
  return;
 }
 const mark=wordScore(LEVELS[level].texts[item],text);
 p.match[item]=mark;
 save();
 $("readStatus").innerHTML=`
 <div class="message">
 <strong>Padanan teks anggaran: ${mark}%</strong>
 <p>Teks dikenal pasti: ${esc(text)}</p>
 <p>${mark>=85?"Padanan bacaan baik.":"Cuba semula untuk meningkatkan padanan."}</p>
 <small>Skor ini bukan penilaian rasmi sebutan dan intonasi.</small>
 </div>`;
}

function quiz(qi){
 item=qi;
 chosen=null;
 order=[];
 const q=LEVELS[level].quiz[qi];
 const isOrder=q.type==="order";
 scene(IMAGES.levels[level],`
 <section class="panel">
 <h2>🧩 CABARAN KEFAHAMAN</h2>
 <p>Tahap ${level+1} · Soalan ${qi+1}/2</p>
 <div class="progress"><div style="width:${80+qi*10}%"></div></div>
 <div class="readtext">${esc(q.question)}</div>
 ${isOrder?`
 <h3>Ayat yang disusun</h3>
 <div class="tiles" id="answerTiles"></div>
 <h3>Pilih perkataan</h3>
 <div class="tiles" id="wordTiles"></div>
 <button class="btn blue" id="clearTiles">PADAM SUSUNAN</button>
 `:`
 <div class="options">
 ${q.options.map((x,j)=>`
 <button class="option" data-choice="${j}">
 ${String.fromCharCode(65+j)}. ${esc(x)}
 </button>`).join("")}
 </div>`}
 <br>
 <button class="btn green" id="checkAnswer">SEMAK JAWAPAN</button>
 <div id="quizMessage"></div>
 </section>
 `);
 if(isOrder){
  const draw=()=>{
   $("answerTiles").innerHTML=order.map((idx,j)=>
    `<button class="tile" data-remove="${j}">${esc(q.tokens[idx])}</button>`
   ).join("");
   $("wordTiles").innerHTML=q.tokens.map((x,j)=>
    order.includes(j)?"":`<button class="tile" data-add="${j}">${esc(x)}</button>`
   ).join("");
   document.querySelectorAll("[data-add]").forEach(b=>{
    b.onclick=()=>{order.push(+b.dataset.add);draw()};
   });
   document.querySelectorAll("[data-remove]").forEach(b=>{
    b.onclick=()=>{order.splice(+b.dataset.remove,1);draw()};
   });
  };
  draw();
  $("clearTiles").onclick=()=>{order=[];draw()};
 }else{
  document.querySelectorAll("[data-choice]").forEach(b=>{
   b.onclick=()=>{
    chosen=+b.dataset.choice;
    document.querySelectorAll("[data-choice]").forEach(x=>
     x.classList.toggle("selected",x===b));
   };
  });
 }
 $("checkAnswer").onclick=()=>{
  const p=player.progress[level];
  if(p.comprehension[qi]!==null)return;
  if(isOrder&&order.length!==q.tokens.length){
   $("quizMessage").innerHTML=
    '<div class="message bad">Susun semua perkataan dahulu.</div>';
   return;
  }
  if(!isOrder&&chosen===null){
   $("quizMessage").innerHTML=
    '<div class="message bad">Pilih jawapan dahulu.</div>';
   return;
  }
  p.attempts[qi]++;
  const correct=isOrder?
   order.every((x,j)=>x===j):
   chosen===q.correct;
  if(correct){
   p.comprehension[qi]=p.attempts[qi]===1?20:10;
   save();
   $("checkAnswer").disabled=true;
   $("quizMessage").innerHTML=`
   <div class="message good">
   <h3>🌟 SYABAS! JAWAPAN BETUL!</h3>
   <p>${esc(q.reason)}</p>
   <p>Markah: ${p.comprehension[qi]}/20</p>
   <button class="btn green" id="continue">
   ${qi===0?"CABARAN SETERUSNYA":"LIHAT GANJARAN"} →
   </button></div>`;
   $("continue").onclick=()=>{
    if(qi===0)quiz(1);
    else finishLevel();
   };
  }else{
   save();
   $("quizMessage").innerHTML=
    '<div class="message bad">Belum tepat. Baca semula dan cuba lagi.</div>';
  }
 };
}

function finishLevel(){
 const p=player.progress[level];
 p.finished=completed(p);
 save();
 const marks=p.comprehension.reduce((a,b)=>a+(b||0),0);
 const total=totalMark(p);
 scene(IMAGES.levels[level],`
 <section class="panel center">
 <h1>🏆 MISI BERJAYA!</h1>
 <h2>${esc(LEVELS[level].title)}</h2>
 <p>Tahniah, ${esc(player.name)}!</p>
 <h2>${total===null?"🌟 BINTANG LATIHAN":"⭐".repeat(stars(total))}</h2>
 <p>Markah kefahaman: ${marks}/40</p>
 <p>${total===null?
 "Markah bacaan rasmi menunggu semakan guru.":
 "Markah keseluruhan: "+total+"/100"}</p>
 <button class="btn green" id="goMap">KEMBALI KE PETA</button>
 </section>
 `);
 $("goMap").onclick=map;
}

async function grade(s,i){
 const p=s.progress[i];
 $("grading").hidden=false;
 $("grading").innerHTML=`
 <h2>Penilaian Tahap ${i+1}</h2>
 <p><strong>${esc(s.name)}</strong> — ${esc(LEVELS[i].title)}</p>
 ${LEVELS[i].texts.map((t,j)=>`
 <div class="panel light">
 <p><strong>Bacaan ${j+1}:</strong> ${esc(t)}</p>
 <button class="btn blue small" data-listen="${j}">
 ▶ DENGAR RAKAMAN
 </button>
 <div class="rubric">
 <label>Sebutan (0–10)
 <input type="number" min="0" max="10" step="1"
 id="s${j}" value="${p.grades[j].s??""}">
 </label>
 <label>Kelancaran (0–5)
 <input type="number" min="0" max="5" step="1"
 id="f${j}" value="${p.grades[j].f??""}">
 </label>
 <label>Intonasi (0–5)
 <input type="number" min="0" max="5" step="1"
 id="i${j}" value="${p.grades[j].i??""}">
 </label>
 </div></div>`).join("")}
 <button class="btn green" id="saveGrade">SIMPAN PENILAIAN</button>
 <p id="gradeMessage"></p>
 `;
 document.querySelectorAll("[data-listen]").forEach(b=>{
  b.onclick=async()=>{
   const clip=await getDB("clips",s.id+"-"+i+"-"+b.dataset.listen);
   if(!clip?.blob){
    $("gradeMessage").textContent="Rakaman tidak tersedia pada peranti ini.";
    return;
   }
   const url=URL.createObjectURL(clip.blob);
   const a=new Audio(url);
   a.onended=()=>URL.revokeObjectURL(url);
   a.play().catch(()=>{
    URL.revokeObjectURL(url);
    $("gradeMessage").textContent="Rakaman gagal dimainkan.";
   });
  };
 });
 $("saveGrade").onclick=async()=>{
  const grades=[];
  for(let j=0;j<3;j++){
   const vals=[
    [$("s"+j),10],
    [$("f"+j),5],
    [$("i"+j),5]
   ];
   if(vals.some(([el,max])=>
    el.value.trim()==="" ||
    !Number.isInteger(Number(el.value)) ||
    +el.value<0 || +el.value>max)){
    $("gradeMessage").textContent=
     "Isi semua markah menggunakan nombor bulat dalam julat ditetapkan.";
    return;
   }
   grades.push({
    s:+$("s"+j).value,
    f:+$("f"+j).value,
    i:+$("i"+j).value
   });
  }
  p.grades=grades;
  await saveDB("sessions",s);
  if(player?.id===s.id){
   player=s;
   save();
  }
  $("gradeMessage").textContent=
   "Penilaian disimpan. Markah rasmi: "+totalMark(p)+"/100.";
 };
 $("grading").scrollIntoView({behavior:"smooth"});
}
